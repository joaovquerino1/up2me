[package]
name = "up2me"
version = "0.1.0"
edition = "2024"
description = "A native macOS (Apple Silicon) YouTube search and downloader built with Rust, egui and yt-dlp"
license = "MIT"
repository = "https://github.com/joaovquerino1/up2me"
readme = "README.md"
keywords = ["youtube", "downloader", "macos", "yt-dlp", "egui"]
categories = ["multimedia"]

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
egui_extras = { version = "0.36.2", features = ["image", "http"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2.190"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
